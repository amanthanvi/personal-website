version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # npm was missing, so security fixes arrived only as one-off PRs; group them weekly.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      build-tooling:
        patterns: ["*"]
        exclude-patterns: ["astro", "@astrojs/*"]
    ignore:
      # @astrojs/check 0.9.x peers on TypeScript ^5 || ^6, so 7.x breaks `npm ci`.
      # Drop this once a release accepts TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
