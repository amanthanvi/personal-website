name: Content Quality

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for markdown files
        id: check_files
        run: |
          if compgen -G "*.md" > /dev/null; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        if: steps.check_files.outputs.has_files == 'true'
        with:
          globs: |
            *.md

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          ignore_words_list: adn,aman,thanvi,doj,ustp,cisa,nasa,umd,sdls,cfs,nos3,ccds,ngn,scan,ltsc,eoust,govt,config,astro,oklch
          skip: ./.git,./node_modules,./dist,./.astro,./package-lock.json

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:worker
      - run: npm run check
      - run: npm run build
